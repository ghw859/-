server:
  port: 8080
  servlet:
    context-path: /

spring:
  # MySQL数据库配置（密码在application-local.yml里，不提交到Git）
  datasource:
    url: jdbc:mysql://localhost:3306/lingmou?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}    # ← 优先读环境变量DB_PASSWORD，没有则用root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis配置（密码在application-local.yml里，不提交到Git）
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms

  # Jackson日期格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # 加载本地配置（每个人自己建application-local.yml，不提交到Git）
  profiles:
    active: local    # ← 默认加载application-local.yml

  # Spring Boot 文件上传
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.icbc.lingmou.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置（密钥在application-local.yml里，不提交到Git）
jwt:
  secret: ${JWT_SECRET:LingMouZhiBanTong2026SecretKeyForJWTAtLeast32Chars}
  expiration: 86400000
  header: Authorization
  token-prefix: "Bearer "

# SpringDoc Swagger配置
springdoc:
  swagger-ui:
    # 访问地址：http://localhost:8080/swagger-ui.html（与规范一致）
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.icbc.lingmou.controller

# AI Python 服务地址
lingmou:
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
  upload:
    dir: ${UPLOAD_DIR:./uploads}       # 上传文件存储目录（项目根目录下 uploads/）
    max-size: 5242880                   # 单文件最大 5MB
    allowed-types: image/jpeg,image/png,image/gif,image/webp,application/pdf

# 日志配置
logging:
  level:
    com.icbc.lingmou: debug
    org.springframework: info
