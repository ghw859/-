# 灵枢前端 nginx 配置（Day 10 compose 编排配套）
# 代理规则与 vite.config.ts 的 server.proxy 逐条对齐，保证容器化后行为与开发期一致

# WebSocket 升级连接参数（仅在有 Upgrade 头时生效，普通请求不受影响）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 上传接口 /api/files 单文件 5MB、批量 20MB，放宽 body 限制
    client_max_body_size 20m;

    # Vue Router history 模式 + 静态资源
    root /usr/share/nginx/html;
    index index.html;

    # AI 相关接口 → Python FastAPI :8000（含 WS /api/ai/chat/ws）
    location /api/ai/ {
        proxy_pass http://ai:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;   # 数字人长对话/打字机输出不被切断
    }

    # 上传文件静态资源 → Java :8080（Spring 静态映射 /uploads/**）
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Swagger / OpenAPI 文档 → Java :8080
    location /v3/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /swagger-ui.html {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /swagger-resources/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 其余所有 /api → Java Spring Boot :8080
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}
